<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="container">
    <h1>리뷰 등록</h1>
    <form action="/reviews/new" method="post">
        <div class="form-group">
            <label for="courseName">강의명</label>
            <input type="text" id="courseName" name="courseName" placeholder="강의명을 입력하세요">
        </div>
        <div class="form-group">
            <label for="professor">교수님 성함</label>
            <input type="text" id="professor" name="professor" placeholder="교수님 성함을 입력하세요">
        </div>
        <div class="form-group">
            <label for="rating">별점 (1-5)</label>
            <input type="number" id="rating" name="rating" min="1" max="5">
        </div>
        <div class="form-group">
            <label for="comment">리뷰 내용</label>
            <textarea id="comment" name="comment" placeholder="리뷰 내용을 작성해주세요"></textarea>
        </div>
        <button type="submit">등록하기</button>
    </form>
</div>
</body>
</html>
